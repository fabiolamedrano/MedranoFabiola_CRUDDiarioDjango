{% load widget_tweaks %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    .font-poppins { font-family: 'Poppins', sans-serif; }
</style>

<div class="min-h-screen bg-purple-50 py-12 px-4 font-poppins">
    <div class="max-w-4xl mx-auto">

        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-semibold text-purple-900">Mi diario</h1>
                <p class="text-sm text-purple-400 mt-1">Tus entradas, en orden</p>
            </div>
            <a href="{% url 'profile_creatediary' %}"
               class="bg-purple-600 hover:bg-purple-700 active:scale-[0.98] text-white font-medium
                      py-2.5 px-5 rounded-lg transition duration-150 shadow-md shadow-purple-300
                      hover:shadow-lg hover:shadow-purple-400">
                Nueva entrada
            </a>
        </div>

        {% if entradas %}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                {% for entrada in entradas %}
                    <a href="{% url 'diario_detail' entrada.pk %}"
                       class="block bg-white rounded-2xl shadow-md shadow-purple-200/50 border border-purple-100
                              p-6 hover:border-purple-300 hover:shadow-lg hover:shadow-purple-300/50
                              transition duration-150">
                        <h2 class="text-lg font-semibold text-purple-900 truncate">
                            {{ entrada.titulo }}
                        </h2>
                        <p class="text-sm text-purple-400 mt-1">{{ entrada.user }}</p>
                        <p class="text-sm text-purple-600 mt-3 line-clamp-3">
                            {{ entrada.contenido|truncatewords:20 }}
                        </p>
                    </a>
                {% endfor %}
            </div>
        {% else %}
            <div class="bg-white rounded-2xl border border-dashed border-purple-200 p-12 text-center">
                <p class="text-purple-400">Todavía no tienes entradas.</p>
                <a href="{% url 'profile_creatediary' %}"
                   class="inline-block mt-4 text-purple-600 font-medium hover:text-purple-700">
                    Escribe la primera →
                </a>
            </div>
        {% endif %}
    </div>
</div>

<script src="https://cdn.tailwindcss.com"></script>
