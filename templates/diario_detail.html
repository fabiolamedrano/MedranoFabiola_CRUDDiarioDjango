{% load widget_tweaks %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    .font-poppins { font-family: 'Poppins', sans-serif; }
</style>

<div class="min-h-screen flex items-center justify-center bg-purple-50 py-12 px-4 font-poppins">
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl shadow-purple-200/60 border border-purple-100 overflow-hidden">

        <div class="h-1.5 bg-gradient-to-r from-purple-300 via-purple-500 to-purple-300"></div>

        <div class="p-8 sm:p-10">
            <a href="{% url 'diario_list' %}"
               class="text-sm text-purple-400 hover:text-purple-600 transition duration-150">
                ← Volver al diario
            </a>

            <div class="mt-4 mb-6">
                <h1 class="text-2xl font-semibold text-purple-900">
                    {{ entrada.titulo }}
                </h1>
                <p class="text-sm text-purple-400 mt-1">{{ entrada.user }}</p>
            </div>

            <p class="text-purple-700 leading-relaxed whitespace-pre-line">
                {{ entrada.contenido }}
            </p>

            <div class="flex justify-end gap-3 mt-8">
                <a href="{% url 'diario_update' entrada.pk %}"
                   class="border-2 border-purple-200 text-purple-700 font-medium
                          py-2.5 px-5 rounded-lg hover:border-purple-300 hover:bg-purple-50
                          transition duration-150">
                    Editar
                </a>
                <a href="{% url 'diario_delete' entrada.pk %}"
                   class="bg-red-50 text-red-600 font-medium border-2 border-red-100
                          py-2.5 px-5 rounded-lg hover:bg-red-100 hover:border-red-200
                          transition duration-150">
                    Eliminar
                </a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.tailwindcss.com"></script>
