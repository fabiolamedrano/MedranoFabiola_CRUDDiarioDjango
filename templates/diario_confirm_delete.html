<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    .font-poppins { font-family: 'Poppins', sans-serif; }
</style>

<div class="min-h-screen flex items-center justify-center bg-purple-50 py-12 px-4 font-poppins">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl shadow-purple-200/60 border border-purple-100 overflow-hidden">

        <div class="h-1.5 bg-red-300"></div>

        <div class="p-8 sm:p-10 text-center">
            <h2 class="text-xl font-semibold text-purple-900">
                Eliminar entrada
            </h2>
            <p class="text-sm text-purple-400 mt-2">
                ¿Seguro que quieres eliminar
                <span class="text-purple-700 font-medium">"{{ object.titulo }}"</span>?
                Esta acción no se puede deshacer.
            </p>

            <form method="post" class="mt-8 flex justify-center gap-3">
                {% csrf_token %}
                <a href="{% url 'diario_detail' object.pk %}"
                   class="border-2 border-purple-200 text-purple-700 font-medium
                          py-2.5 px-5 rounded-lg hover:border-purple-300 hover:bg-purple-50
                          transition duration-150">
                    Cancelar
                </a>
                <button type="submit"
                        class="bg-red-500 hover:bg-red-600 active:scale-[0.98] text-white font-medium
                               py-2.5 px-5 rounded-lg transition duration-150 shadow-md shadow-red-200
                               hover:shadow-lg hover:shadow-red-300">
                    Eliminar
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.tailwindcss.com"></script>
